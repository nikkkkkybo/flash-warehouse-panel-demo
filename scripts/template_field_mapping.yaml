# -*- coding: utf-8 -*-
# 入库模板字段映射配置 (阶段6)
#
# 用途：把"建议清单_已确认_待入库.xlsx"的字段映射到入库模板字段。
# 调整本文件即可适配不同的入库模板，无需改 export_to_template.py 代码。
#
# 字段缺失项统一用 placeholder 标记，不静默填空。
# ============================================================

# 全局：空字段占位符（统一标记，便于人工筛）
placeholder: 待补

# ---- 通用入库模板字段定义 ----
# 顺序即导出列顺序；这些字段覆盖典型入库表所需信息。
generic_template:
  fields:
    - 品身份证
    - 商品名称
    - 品牌
    - 型号
    - 规格
    - 类目
    - 采购价
    - 建议售价
    - 竞品参考价
    - 毛利预估
    - 货源状态
    - 图片状态
    - 标题建议
    - 状态
    - 备注

# ---- 字段映射规则 ----
# 每条规则:
#   source   : 建议清单中的主源列
#   fallback : 主源为空时按顺序尝试的备选列
#   default  : 全部为空时的默认值（不写则用全局 placeholder="待补"）
#   note     : 说明（仅注释，不参与逻辑）
mapping:
  品身份证:
    source: 品身份证
    note: 主键直接传递

  商品名称:
    source: 自家商品名
    fallback: [竞品商品名]
    note: 优先自家商品名；自家无（引入新品）则用竞品名

  品牌:
    default: 待补
    note: 建议清单不含品牌字段，需后续补

  型号:
    default: 待补
    note: 建议清单不含型号字段，需后续补

  规格:
    source: 规格建议_扩规格
    default: 待补

  类目:
    source: 竞品类目
    default: 待补

  采购价:
    source: 建议引入价区间
    fallback: [价格建议_建议售价]
    note: 引入新品用"建议引入价区间"；优化现有用"价格建议_建议售价"

  建议售价:
    source: 价格建议_建议售价
    fallback: [建议引入价区间]

  竞品参考价:
    source: 竞品到手价

  毛利预估:
    source: 预估毛利
    default: 待补

  货源状态:
    default: 待补
    note: 待人工填货源状态（如：已联系供应商/待询价/无货源）

  图片状态:
    source: 图建议_补图
    default: 待补
    note: 来自建议清单"图建议_补图"

  标题建议:
    source: 标题建议_建议标题
    default: 待补

  状态:
    source: 状态
    note: 直接传递（待入库/已入库）

  备注:
    source: 人工备注
    fallback: [建议理由]
    default: ""
    note: 优先人工备注，否则用建议理由；都无则留空（不打"待补"，避免误导）

# ---- 自动相似度匹配（用于 --template 模式）----
# 对模板中未在 mapping 显式声明的字段，按字段名相似度自动找源列。
auto_match:
  # 相似度阈值（0-1），低于此值不自动匹配，需人工在 mapping 中补充
  similarity_threshold: 0.6
  # 是否启用 token 重叠（分词后取交集/并集）
  use_token_overlap: true
